<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <!-- Mobile viewport with proper scaling -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1976d2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1565c0" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Python Code Analyzer - Visual exploration tool for Python projects"
    />
    <!-- Mobile web app capable -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PyAnalyzer" />
    <!-- Prevent phone number detection -->
    <meta name="format-detection" content="telephone=no" />
    <!-- Touch icon for iOS -->
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <title>Python Code Analyzer</title>
    <style>
      /* Critical CSS for mobile layout stability */
      html,
      body,
      #root {
        height: 100%;
        width: 100%;
        overflow-x: hidden;
      }
      /* Prevent rubber-banding on iOS */
      body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
      /* Safe area insets for notched devices */
      .safe-area-top {
        padding-top: env(safe-area-inset-top);
      }
      .safe-area-bottom {
        padding-bottom: env(safe-area-inset-bottom);
      }
      .safe-area-left {
        padding-left: env(safe-area-inset-left);
      }
      .safe-area-right {
        padding-right: env(safe-area-inset-right);
      }
      /* Static shell shown until the app has loaded; it mirrors the app bar and
         navigation so the first paint does not wait for JavaScript. React
         replaces it when it mounts. */
      body {
        margin: 0;
        background: #fff;
        color: rgba(0, 0, 0, 0.87);
        font-family: Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      .boot-bar {
        position: fixed;
        top: 0;
        right: 0;
        left: 0;
        height: 64px;
        display: flex;
        align-items: center;
        padding: 0 24px;
        color: #fff;
        font-size: 1.25rem;
        font-weight: 700;
        background: linear-gradient(135deg, #1976d2 0%, #42a5f5 50%, #64b5f6 100%);
      }
      .boot-nav {
        display: none;
      }
      .boot-main {
        padding: 88px 24px 24px;
      }
      .boot-main p {
        margin: 0;
        color: rgba(0, 0, 0, 0.6);
      }
      @media (min-width: 900px) {
        .boot-bar {
          left: 280px;
        }
        .boot-nav {
          display: block;
          position: fixed;
          top: 0;
          bottom: 0;
          left: 0;
          width: 279px;
          border-right: 1px solid rgba(0, 0, 0, 0.12);
        }
        .boot-main {
          margin-left: 280px;
        }
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #121212;
          color: #fff;
        }
        .boot-main p {
          color: rgba(255, 255, 255, 0.7);
        }
        .boot-nav {
          border-color: rgba(255, 255, 255, 0.12);
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div aria-busy="true">
        <div class="boot-bar">Python Code Analyzer</div>
        <div class="boot-nav"></div>
        <div class="boot-main"><p>Loading the analyzer…</p></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
