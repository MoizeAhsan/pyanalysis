<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <!-- Mobile viewport with proper scaling -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1976d2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1565c0" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Python Code Analyzer - Visual exploration tool for Python projects"
    />
    <!-- Mobile web app capable -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PyAnalyzer" />
    <!-- Prevent phone number detection -->
    <meta name="format-detection" content="telephone=no" />
    <!-- Touch icon for iOS -->
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <title>Python Code Analyzer</title>
    <style>
      /* Critical CSS for mobile layout stability */
      html,
      body,
      #root {
        height: 100%;
        width: 100%;
        overflow-x: hidden;
      }
      /* Prevent rubber-banding on iOS */
      body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
      /* Safe area insets for notched devices */
      .safe-area-top {
        padding-top: env(safe-area-inset-top);
      }
      .safe-area-bottom {
        padding-bottom: env(safe-area-inset-bottom);
      }
      .safe-area-left {
        padding-left: env(safe-area-inset-left);
      }
      .safe-area-right {
        padding-right: env(safe-area-inset-right);
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
